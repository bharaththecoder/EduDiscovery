    <!-- Immediate theme loading and automatic deployment cache invalidation -->
    <script>
      (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();

      // Unregister any legacy Service Workers immediately
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var r of regs) { r.unregister(); }
        }).catch(function() {});
      }

      // Purge all legacy CacheStorage instances
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var k of keys) { caches.delete(k); }
        }).catch(function() {});
      }

      // Proactive Version Sentinel: Instantly detects when a new deployment is live
      (function() {
        var ACTIVE_BUILD_STORAGE_KEY = 'edudiscovery_active_build';

        function checkLatestDeployment() {
          // Fetch version.json bypassing all browser & proxy caches
          fetch('/version.json?ts=' + Date.now(), { cache: 'no-store' })
            .then(function(res) {
              if (res.ok) { return res.json(); }
              throw new Error('Not found');
            })
            .then(function(data) {
              if (data && data.buildId) {
                var storedBuildId = localStorage.getItem(ACTIVE_BUILD_STORAGE_KEY);
                if (!storedBuildId) {
                  // First initialization for this device
                  localStorage.setItem(ACTIVE_BUILD_STORAGE_KEY, data.buildId);
                } else if (storedBuildId !== data.buildId) {
                  // A new deployment is live! Purge local storage key and force-load new version
                  localStorage.setItem(ACTIVE_BUILD_STORAGE_KEY, data.buildId);
                  if ('caches' in window) {
                    caches.keys().then(function(keys) {
                      for (var k of keys) { caches.delete(k); }
                    }).finally(function() {
                      window.location.reload();
                    });
                  } else {
                    window.location.reload();
                  }
                }
              }
            })
            .catch(function() {});
        }

        // 1. Check immediately when script evaluates
        checkLatestDeployment();

        // 2. Automatically reload if any stale chunk causes a Vite preload error
        window.addEventListener('vite:preloadError', function(event) {
          event.preventDefault();
          checkLatestDeployment();
        });

        // 3. Check whenever the user switches back to the tab/window on mobile or desktop
        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'visible') {
            checkLatestDeployment();
          }
        });

        // 4. Also check on pageshow event (handles mobile back/forward cache restore)
        window.addEventListener('pageshow', function(event) {
          if (event.persisted) {
            checkLatestDeployment();
          }
        });

        // 5. Periodic background heartbeat check every 2 minutes
        setInterval(checkLatestDeployment, 2 * 60 * 1000);
      })();
    </script>
