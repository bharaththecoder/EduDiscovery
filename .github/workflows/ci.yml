name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Static Analysis (ESLint 9)
        run: npm run lint

      - name: TypeScript Compilation Check
        run: npx tsc --noEmit

      - name: Automated Unit & Security Tests (Vitest)
        run: npm test

      - name: Client Production Build
        run: npm run build
