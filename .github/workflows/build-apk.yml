name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Compile Android APK (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK Artifact
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/EduDiscovery-v1.0.apk
          echo "APK successfully created at release-output/EduDiscovery-v1.0.apk"

      - name: Upload Build Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: EduDiscovery-Android-APK
          path: release-output/EduDiscovery-v1.0.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: EduDiscovery Android Release ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            ### 🎓 EduDiscovery Android Native APK Release
            
            Download the native Android application package below to experience EduDiscovery on your mobile device.
            
            #### Highlights:
            - **Live Online Data**: Fast direct synchronization with live verified colleges, cutoff statements, and gazetted fees.
            - **3-Year Statutory Cutoffs**: Verified closing ranks from official APSCHE final phase allotment records (2024, 2023, 2022).
            - **Statutory APHERMC Fees**: Exact gazetted fee schedules governed by G.O.Ms.No.17 & G.O.Ms.No.48.
            - **Zero Multipliers**: Sourced integer ranks and official category quotas.
            
            **Download Link**: [EduDiscovery-v1.0.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.release_tag || github.ref_name }}/EduDiscovery-v1.0.apk)
          files: release-output/EduDiscovery-v1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
